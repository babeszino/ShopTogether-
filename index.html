<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ShopTogether!">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#16a34a">
<title>ShopTogether!</title>
<style>
  :root {
    --bg: #f3f4f6;
    --card: #ffffff;
    --text: #111827;
    --muted: #6b7280;
    --line: #e5e7eb;
    --accent: #16a34a;
    --accent-text: #ffffff;
    --danger: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0f14;
      --card: #161b22;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --line: #2a313b;
      --accent: #22c55e;
      --accent-text: #052e16;
      --danger: #f87171;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 17px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: calc(env(safe-area-inset-top) + 12px) 16px 8px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  header h1 { font-size: 26px; margin: 0; flex: 1; }
  .status { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .status.live .dot { background: var(--accent); }
  .icon-btn {
    border: 0; background: var(--card); color: var(--text);
    width: 40px; height: 40px; border-radius: 12px; font-size: 18px;
  }
  form.add { display: flex; gap: 8px; padding: 4px 16px 8px; }
  input[type=text] {
    flex: 1; min-width: 0;
    font: inherit; font-size: 16px; /* 16px stops iOS zooming on focus */
    padding: 12px 14px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--card); color: var(--text);
  }
  button { font: inherit; cursor: pointer; }
  form.add button {
    border: 0; border-radius: 12px; padding: 0 18px;
    background: var(--accent); color: var(--accent-text); font-weight: 700;
  }
  main { flex: 1; overflow-y: auto; padding: 0 16px 16px; -webkit-overflow-scrolling: touch; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 16px 4px 6px; }
  ul { list-style: none; margin: 0; padding: 0; background: var(--card); border-radius: 14px; overflow: hidden; }
  li { display: flex; align-items: center; border-top: 1px solid var(--line); }
  li:first-child { border-top: 0; }
  .check {
    flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px;
    border: 0; background: none; color: inherit; text-align: left; padding: 12px 8px 12px 14px;
  }
  .circle {
    flex: none; width: 28px; height: 28px; border-radius: 50%;
    border: 2px solid var(--muted); display: grid; place-items: center;
    color: var(--accent-text); font-weight: 900; font-size: 16px;
  }
  .in-cart .circle { background: var(--accent); border-color: var(--accent); }
  .in-cart .name { text-decoration: line-through; color: var(--muted); }
  .name { display: block; overflow-wrap: anywhere; }
  .by { display: block; font-size: 12px; color: var(--muted); }
  .del { border: 0; background: none; color: var(--muted); font-size: 20px; width: 48px; align-self: stretch; }
  .del:active { color: var(--danger); }
  .empty { text-align: center; color: var(--muted); padding: 48px 16px; }
  footer {
    padding: 12px 16px calc(env(safe-area-inset-bottom) + 12px);
    background: var(--bg); border-top: 1px solid var(--line);
  }
  #done {
    width: 100%; border: 0; border-radius: 14px; padding: 16px;
    background: var(--accent); color: var(--accent-text); font-size: 18px; font-weight: 700;
  }
  #done:disabled { opacity: .35; }
  .overlay {
    position: fixed; inset: 0; background: var(--bg); z-index: 10;
    display: flex; flex-direction: column; justify-content: center; gap: 12px; padding: 24px;
  }
  .overlay[hidden] { display: none; }
  .overlay h2 { font-size: 24px; text-transform: none; letter-spacing: 0; color: var(--text); margin: 0; }
  .overlay p { margin: 0; color: var(--muted); }
  .overlay button.primary {
    border: 0; border-radius: 12px; padding: 14px; background: var(--accent);
    color: var(--accent-text); font-weight: 700; font-size: 17px;
  }
  code { background: var(--card); padding: 1px 5px; border-radius: 5px; }
  .toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 90px);
    transform: translateX(-50%); background: var(--text); color: var(--bg);
    padding: 8px 14px; border-radius: 999px; font-size: 14px; opacity: 0; transition: opacity .2s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <h1>ShopTogether!</h1>
  <div class="status" id="status"><span class="dot"></span><span id="statusText">Connecting…</span></div>
  <button class="icon-btn" id="share" aria-label="Share link">⤴︎</button>
</header>

<form class="add" id="addForm" autocomplete="off">
  <input type="text" id="newItem" placeholder="Add something (apples, bread…)" enterkeyhint="done" autocapitalize="sentences">
  <button type="submit">Add</button>
</form>

<main>
  <div id="list"></div>
  <div class="empty" id="empty" hidden>Nothing to buy yet.<br>Add something above, it shows up on the other phone too.</div>
  <div class="empty" id="error" hidden></div>
</main>

<footer>
  <button id="done" disabled>Done with shopping</button>
</footer>

<div class="overlay" id="nameOverlay" hidden>
  <h2>What's your name?</h2>
  <p>So the other person can see who added what.</p>
  <form id="nameForm" style="display:flex;flex-direction:column;gap:12px">
    <input type="text" id="nameInput" placeholder="Your name" autocapitalize="words">
    <button class="primary" type="submit">Start</button>
  </form>
</div>

<div class="overlay" id="setupOverlay" hidden>
  <h2>One-time setup needed</h2>
  <p>Open <code>firebase-config.js</code> and paste in your Firebase web config. The README explains how (about 5 minutes).</p>
</div>

<div class="toast" id="toast"></div>

<script type="module">
  import { firebaseConfig } from "./firebase-config.js";

  const $ = (s) => document.querySelector(s);
  const listEl = $("#list"), emptyEl = $("#empty"), errorEl = $("#error");
  const doneBtn = $("#done"), statusEl = $("#status"), statusText = $("#statusText");

  // ---------- Which list? The list code lives in the link (#code) ----------
  function makeCode() {
    const alphabet = "abcdefghjkmnpqrstuvwxyz23456789";
    const bytes = crypto.getRandomValues(new Uint8Array(12));
    return Array.from(bytes, (b) => alphabet[b % alphabet.length]).join("");
  }
  let code = location.hash.replace("#", "").trim();
  if (!code) {
    code = makeCode();
    history.replaceState(null, "", "#" + code);
  }

  // ---------- Name ----------
  const safeStorage = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };
  let myName = safeStorage.get("shoptogether-name") || "";

  function askName() {
    return new Promise((resolve) => {
      $("#nameOverlay").hidden = false;
      $("#nameInput").focus();
      $("#nameForm").addEventListener("submit", (e) => {
        e.preventDefault();
        const v = $("#nameInput").value.trim();
        if (!v) return;
        safeStorage.set("shoptogether-name", v);
        $("#nameOverlay").hidden = true;
        resolve(v);
      });
    });
  }

  // ---------- Toast ----------
  let toastTimer;
  function toast(msg) {
    const t = $("#toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
  }

  // ---------- Share link ----------
  $("#share").addEventListener("click", async () => {
    const url = location.href;
    try {
      if (navigator.share) {
        await navigator.share({ title: "ShopTogether!", text: "Our shared shopping list", url });
        return;
      }
    } catch { return; /* user cancelled */ }
    try { await navigator.clipboard.writeText(url); toast("Link copied"); }
    catch { prompt("Copy this link:", url); }
  });

  // ---------- Firebase ----------
  if (!firebaseConfig || !firebaseConfig.apiKey || firebaseConfig.apiKey.startsWith("PASTE")) {
    $("#setupOverlay").hidden = false;
    throw new Error("firebase-config.js not filled in");
  }

  const V = "10.14.1";
  const [{ initializeApp }, { getAuth, signInAnonymously }, fs] = await Promise.all([
    import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`),
    import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`),
    import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`),
  ]);
  const { initializeFirestore, persistentLocalCache, persistentMultipleTabManager,
          collection, doc, addDoc, updateDoc, query, orderBy, onSnapshot, writeBatch } = fs;

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  let db;
  try {
    // Keeps the list available (and editable) with bad signal in the store.
    db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });
  } catch {
    db = fs.getFirestore(app);
  }
  const itemsRef = collection(db, "lists", code, "items");

  if (!myName) myName = await askName();

  // ---------- State + rendering ----------
  let items = [];

  function rowFor(item) {
    const li = document.createElement("li");
    if (item.inCart) li.classList.add("in-cart");

    const check = document.createElement("button");
    check.className = "check";
    check.setAttribute("aria-pressed", String(item.inCart));

    const circle = document.createElement("span");
    circle.className = "circle";
    circle.textContent = item.inCart ? "✓" : "";

    const text = document.createElement("span");
    const name = document.createElement("span");
    name.className = "name";
    name.textContent = item.name;
    const by = document.createElement("span");
    by.className = "by";
    by.textContent = item.addedBy ? (item.addedBy === myName ? "Added by you" : "Added by " + item.addedBy) : "";
    text.append(name, by);

    check.append(circle, text);
    check.addEventListener("click", () => {
      updateDoc(doc(db, "lists", code, "items", item.id), { inCart: !item.inCart }).catch(showError);
    });

    const del = document.createElement("button");
    del.className = "del";
    del.setAttribute("aria-label", "Delete " + item.name);
    del.textContent = "✕";
    del.addEventListener("click", () => {
      const b = writeBatch(db);
      b.delete(doc(db, "lists", code, "items", item.id));
      b.commit().catch(showError);
    });

    li.append(check, del);
    return li;
  }

  function section(title, group) {
    const wrap = document.createElement("section");
    const h = document.createElement("h2");
    h.textContent = title;
    const ul = document.createElement("ul");
    group.forEach((i) => ul.append(rowFor(i)));
    wrap.append(h, ul);
    return wrap;
  }

  function render() {
    const toBuy = items.filter((i) => !i.inCart);
    const inCart = items.filter((i) => i.inCart);
    listEl.replaceChildren();
    if (toBuy.length) listEl.append(section("To buy", toBuy));
    if (inCart.length) listEl.append(section("In the cart", inCart));
    emptyEl.hidden = items.length > 0;
    doneBtn.disabled = inCart.length === 0;
  }

  function showError(err) {
    console.error(err);
    errorEl.hidden = false;
    errorEl.textContent = "Problem: " + (err && err.message ? err.message : err);
  }

  // ---------- Actions ----------
  $("#addForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const input = $("#newItem");
    const name = input.value.trim();
    if (!name) return;
    addDoc(itemsRef, { name, addedBy: myName, inCart: false, createdAt: Date.now() }).catch(showError);
    input.value = "";
    input.focus(); // keep the keyboard open for the next item
  });

  // "Done with shopping": remove everything that was put in the cart
  doneBtn.addEventListener("click", () => {
    const bought = items.filter((i) => i.inCart);
    if (!bought.length) return;
    const b = writeBatch(db);
    bought.forEach((i) => b.delete(doc(db, "lists", code, "items", i.id)));
    b.commit().then(() => toast("Shopping done!")).catch(showError);
  });

  // ---------- Live sync ----------
  function setStatus(live) {
    statusEl.classList.toggle("live", live);
    statusText.textContent = live ? "Live" : "Offline";
  }

  try {
    await signInAnonymously(auth);
  } catch (err) {
    showError(err);
    setStatus(false);
    throw err;
  }

  onSnapshot(
    query(itemsRef, orderBy("createdAt")),
    { includeMetadataChanges: true },
    (snap) => {
      items = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      errorEl.hidden = true;
      setStatus(!snap.metadata.fromCache);
      render();
    },
    (err) => { showError(err); setStatus(false); }
  );
  window.addEventListener("offline", () => setStatus(false));
</script>
</body>
</html>
