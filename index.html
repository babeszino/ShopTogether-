<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ShopTogether!">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#16a34a">
<title>ShopTogether!</title>
<style>
  :root {
    --bg: #f3f4f6;
    --card: #ffffff;
    --text: #111827;
    --muted: #6b7280;
    --line: #e5e7eb;
    --accent: #16a34a;
    --accent-text: #ffffff;
    --danger: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0f14;
      --card: #161b22;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --line: #2a313b;
      --accent: #22c55e;
      --accent-text: #052e16;
      --danger: #f87171;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 17px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
  }
  #app { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  button { font: inherit; cursor: pointer; }
  input[type=text], input[type=email], input[type=password] {
    width: 100%; min-width: 0;
    font: inherit; font-size: 16px; /* 16px stops iOS zooming on focus */
    padding: 12px 14px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--card); color: var(--text);
  }
  

  /* header */
  header {
    padding: calc(env(safe-area-inset-top) + 12px) 16px 8px;
    display: flex; align-items: center; gap: 10px;
  }
  .titles { flex: 1; min-width: 0; }
  .titles h1 { font-size: 26px; margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sub { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .icon-btn {
    border: 0; background: var(--card); color: var(--text);
    min-width: 40px; height: 40px; border-radius: 12px; font-size: 18px; padding: 0 12px;
  }
  .icon-btn.text { font-size: 14px; }
  .status { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .status.live .dot { background: var(--accent); }

  /* generic bits */
  main { flex: 1; overflow-y: auto; padding: 0 16px 16px; -webkit-overflow-scrolling: touch; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 16px 4px 6px; }
  .card { background: var(--card); border-radius: 14px; padding: 14px; margin: 0 0 10px; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .grow { flex: 1; min-width: 0; }
  .muted { color: var(--muted); }
  .small { font-size: 14px; }
  .err { color: var(--danger); margin: 0; font-size: 14px; min-height: 1.2em; }
  .empty { text-align: center; color: var(--muted); padding: 40px 16px; }
  button.primary, .btn {
    border: 0; border-radius: 12px; padding: 12px 16px; font-weight: 700;
    background: var(--accent); color: var(--accent-text);
  }
  button.secondary { border: 0; border-radius: 12px; padding: 12px 16px; font-weight: 600; background: var(--line); color: var(--text); }
  button.danger { border: 0; border-radius: 12px; padding: 12px 16px; font-weight: 600; background: none; color: var(--danger); }
  button.wide { width: 100%; }
  button.link { border: 0; background: none; color: var(--accent); padding: 6px; font-size: 15px; }
  button:disabled { opacity: .4; }

  /* home */
  .list-btn {
    display: flex; width: 100%; align-items: center; gap: 12px; border: 0;
    background: var(--card); color: inherit; text-align: left;
    padding: 14px; border-radius: 14px; margin-bottom: 8px;
  }
  .list-btn .chev { margin-left: auto; color: var(--muted); font-size: 24px; }
  .list-name { font-weight: 600; }

  /* items */
  form.add { display: flex; gap: 8px; padding: 4px 16px 8px; }
  form.add button { border: 0; border-radius: 12px; padding: 0 18px; background: var(--accent); color: var(--accent-text); font-weight: 700; }
  ul { list-style: none; margin: 0; padding: 0; background: var(--card); border-radius: 14px; overflow: hidden; }
  li { display: flex; align-items: center; border-top: 1px solid var(--line); }
  li:first-child { border-top: 0; }
  .check {
    flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px;
    border: 0; background: none; color: inherit; text-align: left; padding: 12px 8px 12px 14px;
  }
  .circle {
    flex: none; width: 28px; height: 28px; border-radius: 50%;
    border: 2px solid var(--muted); display: grid; place-items: center;
    color: var(--accent-text); font-weight: 900; font-size: 16px;
  }
  .in-cart .circle { background: var(--accent); border-color: var(--accent); }
  .in-cart .name { text-decoration: line-through; color: var(--muted); }
  .name { display: block; overflow-wrap: anywhere; }
  .by { display: block; font-size: 12px; color: var(--muted); }
  .del { border: 0; background: none; color: var(--muted); font-size: 20px; width: 48px; align-self: stretch; }
  .del:active { color: var(--danger); }
  footer {
    padding: 12px 16px calc(env(safe-area-inset-bottom) + 12px);
    background: var(--bg); border-top: 1px solid var(--line);
  }
  #done { width: 100%; border: 0; border-radius: 14px; padding: 16px; background: var(--accent); color: var(--accent-text); font-size: 18px; font-weight: 700; }
  #done:disabled { opacity: .35; }

  /* auth + modal */
  .auth { margin: auto; width: 100%; max-width: 380px; padding: 24px 16px; }
  .auth h1 { font-size: 30px; margin: 0 0 4px; }
  .overlay {
    position: fixed; inset: 0; background: var(--bg); z-index: 10;
    display: flex; flex-direction: column; justify-content: center; gap: 12px; padding: 24px;
  }
  .auth h2, .overlay h2 { font-size: 22px; text-transform: none; letter-spacing: 0; color: var(--text); margin: 0; }
  .overlay p { margin: 0; color: var(--muted); }
  code { background: var(--card); padding: 1px 5px; border-radius: 5px; }
  .toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 90px);
    transform: translateX(-50%); background: var(--text); color: var(--bg);
    padding: 8px 14px; border-radius: 999px; font-size: 14px; opacity: 0; transition: opacity .2s;
    pointer-events: none; z-index: 20; max-width: 90vw; text-align: center;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<div id="app"></div>

<div class="overlay" id="setupOverlay" hidden>
  <h2>One-time setup needed</h2>
  <p>Open <code>firebase-config.js</code> and paste in your Firebase web config. The README explains how.</p>
</div>

<div class="toast" id="toast"></div>

<script type="module">
  import { firebaseConfig } from "./firebase-config.js";

  const $ = (s) => document.querySelector(s);
  const appEl = $("#app");

  // Tiny DOM helper: h("div", {class: "x", onclick: fn}, child, child…)
  const h = (tag, props = {}, ...kids) => {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(props)) {
      if (v == null || v === false) continue;
      if (k === "class") el.className = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else if (v === true) el.setAttribute(k, "");
      else el.setAttribute(k, v);
    }
    el.append(...kids.flat().filter((k) => k != null && k !== false));
    return el;
  };

  let toastTimer;
  function toast(msg) {
    const t = $("#toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 2500);
  }

  if (!firebaseConfig || !firebaseConfig.apiKey || firebaseConfig.apiKey.startsWith("PASTE")) {
    $("#setupOverlay").hidden = false;
    throw new Error("firebase-config.js not filled in");
  }

  // ---------- Firebase ----------
  const V = "10.14.1";
  const [{ initializeApp }, A, fs] = await Promise.all([
    import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`),
    import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`),
    import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`),
  ]);
  const { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signOut } = A;
  const { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, getFirestore,
          collection, doc, setDoc, addDoc, updateDoc, deleteDoc, getDocs, query, where, orderBy,
          onSnapshot, writeBatch, arrayUnion } = fs;

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  let db;
  try {
    // Keeps lists available (and editable) with bad signal in the store.
    db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });
  } catch {
    db = getFirestore(app);
  }

  // ---------- State ----------
  let user = null;
  let authReady = false;
  let subs = [];
  const listen = (unsub) => subs.push(unsub);
  const clearSubs = () => { subs.forEach((u) => u()); subs = []; };
  const myName = () => (user.displayName || user.email.split("@")[0]).split(" ")[0];
  const myEmail = () => user.email.toLowerCase();

  function cleanEmail(v) {
    const e = v.trim().toLowerCase();
    return /^[^\s@\/]+@[^\s@\/]+\.[^\s@\/]+$/.test(e) ? e : null;
  }

  function niceError(ex) {
    const map = {
      "auth/popup-closed-by-user": "Sign-in cancelled.",
      "auth/cancelled-popup-request": "Sign-in cancelled.",
      "auth/popup-blocked": "Your browser blocked the Google window. Allow pop-ups for this site and try again.",
      "auth/unauthorized-domain": "This website's address isn't authorized in Firebase yet (see README, step 2).",
      "auth/operation-not-allowed": "Google sign-in isn't enabled in Firebase yet (see README, step 1).",
      "auth/network-request-failed": "No connection. Check your internet and try again.",
      "permission-denied": "You don't have permission to do that (are the Firestore rules published?).",
    };
    return map[ex && ex.code] || (ex && ex.message) || "Something went wrong.";
  }
  const showErr = (ex) => { console.error(ex); toast(niceError(ex)); };

  // ---------- Layout helpers ----------
  const mount = (...els) => appEl.replaceChildren(...els);

  function ask({ title, text, value = "", placeholder = "", type = "text", ok = "OK" }) {
    return new Promise((resolve) => {
      const input = h("input", { type, placeholder, value, autocapitalize: type === "email" ? "none" : "sentences" });
      const close = (v) => { ov.remove(); resolve(v); };
      const ov = h("div", { class: "overlay" },
        h("h2", {}, title),
        text ? h("p", {}, text) : null,
        h("form", {
          class: "stack",
          onsubmit: (e) => { e.preventDefault(); const v = input.value.trim(); if (v) close(v); },
        },
          input,
          h("button", { class: "primary", type: "submit" }, ok),
          h("button", { class: "secondary", type: "button", onclick: () => close(null) }, "Cancel")
        )
      );
      document.body.append(ov);
      input.focus();
    });
  }

  // ---------- Router ----------
  function route() {
    clearSubs();
    if (!authReady) return mount(h("div", { class: "empty" }, "Loading…"));
    if (!user) return renderAuth();
    const m = location.hash.match(/^#\/list\/([A-Za-z0-9]+)/);
    if (m) renderList(m[1]); else renderHome();
  }
  window.addEventListener("hashchange", route);
  onAuthStateChanged(auth, (u) => { user = u; authReady = true; route(); });

  // ---------- Sign in with Google ----------
  function renderAuth() {
    const err = h("p", { class: "err" });
    const btn = h("button", {
      class: "primary wide",
      onclick: async () => {
        err.textContent = "";
        btn.disabled = true;
        try {
          await signInWithPopup(auth, new GoogleAuthProvider());
        } catch (ex) {
          err.textContent = niceError(ex);
        } finally {
          btn.disabled = false;
        }
      },
    }, "Continue with Google");

    mount(h("div", { class: "auth stack" },
      h("h1", {}, "ShopTogether!"),
      h("p", { class: "muted", style: "margin:0 0 8px" }, "A shopping list you share, live."),
      btn, err,
      h("p", { class: "muted small", style: "margin:0" }, "Use the same Google account your partner invites.")));
  }

  // ---------- Home: my lists + invitations ----------
  async function sendInvite(listId, listName, email) {
    await setDoc(doc(db, "invites", `${listId}_${email}`), {
      listId, listName, fromUid: user.uid, fromName: myName(), toEmail: email, createdAt: Date.now(),
    });
  }

  async function createList(name, partnerEmail) {
    const ref = doc(collection(db, "lists"));
    await setDoc(ref, {
      name, ownerUid: user.uid, members: [user.uid],
      memberNames: { [user.uid]: myName() }, createdAt: Date.now(),
    });
    if (partnerEmail) {
      try { await sendInvite(ref.id, name, partnerEmail); toast("Invitation sent"); }
      catch (ex) { showErr(ex); }
    }
    location.hash = "#/list/" + ref.id;
  }

  async function acceptInvite(inv) {
    try {
      await updateDoc(doc(db, "lists", inv.listId), {
        members: arrayUnion(user.uid),
        ["memberNames." + user.uid]: myName(),
      });
      await deleteDoc(doc(db, "invites", inv.id)).catch(() => {});
      location.hash = "#/list/" + inv.listId;
    } catch (ex) { showErr(ex); }
  }

  function renderHome() {
    let myLists = [], invites = [], firstPaint = true;
    const invitesBox = h("div");
    const listsBox = h("div");

    // New list form
    const nameI = h("input", { type: "text", placeholder: "List name (e.g. Groceries)", value: "Groceries" });
    const mailI = h("input", { type: "email", placeholder: "Partner's email (optional)", autocapitalize: "none", inputmode: "email" });
    const formErr = h("p", { class: "err" });
    const openBtn = h("button", { class: "primary wide", onclick: () => { form.hidden = false; openBtn.hidden = true; nameI.focus(); nameI.select(); } }, "＋ New shopping list");
    const form = h("form", {
      class: "card stack", hidden: true,
      onsubmit: async (e) => {
        e.preventDefault();
        formErr.textContent = "";
        const name = nameI.value.trim();
        if (!name) { formErr.textContent = "Give the list a name."; return; }
        let partner = null;
        if (mailI.value.trim()) {
          partner = cleanEmail(mailI.value);
          if (!partner) { formErr.textContent = "That email address doesn't look right."; return; }
          if (partner === myEmail()) { formErr.textContent = "That's your own email."; return; }
        }
        try { await createList(name, partner); } catch (ex) { formErr.textContent = niceError(ex); }
      },
    },
      h("div", { class: "muted small" }, "Name your list, and optionally invite your partner by their Google email address. You can also invite later."),
      nameI, mailI, formErr,
      h("div", { class: "row" },
        h("button", { class: "primary grow", type: "submit" }, "Create list"),
        h("button", { class: "secondary", type: "button", onclick: () => { form.hidden = true; openBtn.hidden = false; } }, "Cancel")));

    function paint() {
      const joined = new Set(myLists.map((l) => l.id));
      // Invite that was already accepted but not cleaned up
      invites.filter((i) => joined.has(i.listId)).forEach((i) => deleteDoc(doc(db, "invites", i.id)).catch(() => {}));
      const pending = invites.filter((i) => !joined.has(i.listId));

      invitesBox.replaceChildren(...(pending.length ? [
        h("h2", {}, "Invitations"),
        ...pending.map((inv) => h("div", { class: "card stack" },
          h("div", {}, h("b", {}, inv.fromName || "Someone"), " invited you to ", h("b", {}, inv.listName)),
          h("div", { class: "row" },
            h("button", { class: "primary grow", onclick: () => acceptInvite(inv) }, "Accept"),
            h("button", { class: "secondary grow", onclick: () => deleteDoc(doc(db, "invites", inv.id)).catch(showErr) }, "Decline"))))
      ] : []));

      listsBox.replaceChildren(
        h("h2", {}, "Your shopping lists"),
        ...(myLists.length ? myLists.map((l) => {
          const others = Object.entries(l.memberNames || {}).filter(([uid]) => uid !== user.uid).map(([, n]) => n);
          return h("button", { class: "list-btn", onclick: () => { location.hash = "#/list/" + l.id; } },
            h("div", { class: "grow" },
              h("div", { class: "list-name" }, l.name),
              h("div", { class: "sub" }, others.length ? "With " + others.join(", ") : "Just you")),
            h("span", { class: "chev" }, "›"));
        }) : [h("div", { class: "empty" }, "No shopping lists yet. Create your first one below.")]));

      if (firstPaint && !myLists.length && !pending.length && listsLoaded) {
        form.hidden = false; openBtn.hidden = true; firstPaint = false;
      }
    }
    let listsLoaded = false;

    mount(
      h("header", {},
        h("div", { class: "titles" }, h("h1", {}, "ShopTogether!"), h("div", { class: "sub" }, "Hi " + myName())),
        h("button", { class: "icon-btn text", onclick: () => signOut(auth) }, "Sign out")),
      h("main", {}, invitesBox, listsBox, openBtn, form));

    listen(onSnapshot(query(collection(db, "lists"), where("members", "array-contains", user.uid)),
      (snap) => {
        myLists = snap.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => a.createdAt - b.createdAt);
        listsLoaded = true;
        paint();
      }, showErr));
    listen(onSnapshot(query(collection(db, "invites"), where("toEmail", "==", myEmail())),
      (snap) => { invites = snap.docs.map((d) => ({ id: d.id, ...d.data() })); paint(); }, showErr));
    paint();
  }

  // ---------- One shopping list (live) ----------
  function renderList(listId) {
    const listRef = doc(db, "lists", listId);
    const itemsRef = collection(db, "lists", listId, "items");
    let list = null, items = [], sentInvites = [];

    const titleEl = h("h1", {}, "…");
    const subEl = h("div", { class: "sub" });
    const statusText = h("span", {}, "Connecting…");
    const statusEl = h("div", { class: "status" }, h("span", { class: "dot" }), statusText);
    const itemsBox = h("div");
    const infoBox = h("div");
    const emptyEl = h("div", { class: "empty", hidden: true }, "Nothing to buy yet.", h("br"), "Add something above, it shows up on the other phone too.");
    const doneBtn = h("button", { id: "done", disabled: true }, "Done with shopping");
    const input = h("input", { type: "text", placeholder: "Add something (apples, bread…)", enterkeyhint: "done", autocomplete: "off" });

    const renameBtn = h("button", { class: "icon-btn", "aria-label": "Rename list", onclick: async () => {
      if (!list) return;
      const name = await ask({ title: "Rename list", value: list.name, ok: "Save" });
      if (name) updateDoc(listRef, { name }).catch(showErr);
    } }, "✎");

    function rowFor(item) {
      const circle = h("span", { class: "circle" }, item.inCart ? "✓" : "");
      const who = item.addedByUid === user.uid ? "Added by you" : (item.addedBy ? "Added by " + item.addedBy : "");
      return h("li", { class: item.inCart ? "in-cart" : "" },
        h("button", { class: "check", "aria-pressed": String(!!item.inCart),
          onclick: () => updateDoc(doc(itemsRef, item.id), { inCart: !item.inCart }).catch(showErr) },
          circle,
          h("span", {}, h("span", { class: "name" }, item.name), h("span", { class: "by" }, who))),
        h("button", { class: "del", "aria-label": "Delete " + item.name,
          onclick: () => deleteDoc(doc(itemsRef, item.id)).catch(showErr) }, "✕"));
    }
    const section = (title, group) => h("section", {}, h("h2", {}, title), h("ul", {}, group.map(rowFor)));

    async function inviteSomeone() {
      const raw = await ask({ title: "Invite someone", text: "Type the Google email address they sign in with.", type: "email", placeholder: "name@example.com", ok: "Send invitation" });
      if (!raw) return;
      const email = cleanEmail(raw);
      if (!email) return toast("That email address doesn't look right.");
      if (email === myEmail()) return toast("That's your own email.");
      try { await sendInvite(listId, list.name, email); toast("Invitation sent"); } catch (ex) { showErr(ex); }
    }

    async function deleteList() {
      if (!confirm(`Delete "${list.name}" for everyone? This can't be undone.`)) return;
      try {
        const snap = await getDocs(itemsRef);
        const b = writeBatch(db);
        snap.docs.forEach((d) => b.delete(d.ref));
        sentInvites.forEach((i) => b.delete(doc(db, "invites", i.id)));
        await b.commit();
        await deleteDoc(listRef);
        location.hash = "";
      } catch (ex) { showErr(ex); }
    }

    function paint() {
      const toBuy = items.filter((i) => !i.inCart);
      const inCart = items.filter((i) => i.inCart);
      itemsBox.replaceChildren(
        ...(toBuy.length ? [section("To buy", toBuy)] : []),
        ...(inCart.length ? [section("In the cart", inCart)] : []));
      emptyEl.hidden = items.length > 0;
      doneBtn.disabled = inCart.length === 0;

      if (!list) return;
      titleEl.textContent = list.name;
      const names = Object.entries(list.memberNames || {}).map(([uid, n]) => (uid === user.uid ? "You" : n));
      subEl.textContent = names.join(" & ");
      infoBox.replaceChildren(
        h("h2", {}, "Who's on this list"),
        h("div", { class: "card stack" },
          ...Object.entries(list.memberNames || {}).map(([uid, n]) =>
            h("div", {}, n, uid === user.uid ? h("span", { class: "muted" }, " (you)") : null)),
          ...sentInvites.map((i) => h("div", { class: "row" },
            h("div", { class: "grow muted small" }, "✉ " + i.toEmail + " – waiting to accept"),
            h("button", { class: "link", onclick: () => deleteDoc(doc(db, "invites", i.id)).catch(showErr) }, "Cancel"))),
          h("button", { class: "secondary", onclick: inviteSomeone }, "Invite someone"),
          list.ownerUid === user.uid ? h("button", { class: "danger", onclick: deleteList }, "Delete this list") : null));
    }

    mount(
      h("header", {},
        h("button", { class: "icon-btn", "aria-label": "Back to my lists", onclick: () => { location.hash = ""; } }, "‹"),
        h("div", { class: "titles" }, titleEl, subEl),
        statusEl, renameBtn),
      h("form", {
        class: "add", autocomplete: "off",
        onsubmit: (e) => {
          e.preventDefault();
          const name = input.value.trim();
          if (!name) return;
          addDoc(itemsRef, { name, addedBy: myName(), addedByUid: user.uid, inCart: false, createdAt: Date.now() }).catch(showErr);
          input.value = "";
          input.focus(); // keep the keyboard open for the next item
        },
      }, input, h("button", { type: "submit" }, "Add")),
      h("main", {}, itemsBox, emptyEl, infoBox),
      h("footer", {}, doneBtn));

    // "Done with shopping": remove everything that was put in the cart
    doneBtn.addEventListener("click", () => {
      const bought = items.filter((i) => i.inCart);
      if (!bought.length) return;
      const b = writeBatch(db);
      bought.forEach((i) => b.delete(doc(itemsRef, i.id)));
      b.commit().then(() => toast("Shopping done!")).catch(showErr);
    });

    const noAccess = (ex) => {
      if (ex && ex.code === "permission-denied") { toast("You don't have access to that list."); location.hash = ""; }
      else showErr(ex);
    };

    listen(onSnapshot(listRef, (snap) => {
      if (!snap.exists()) { if (!snap.metadata.fromCache) { toast("That list doesn't exist (anymore)."); location.hash = ""; } return; }
      list = { id: snap.id, ...snap.data() };
      paint();
    }, noAccess));

    listen(onSnapshot(query(itemsRef, orderBy("createdAt")), { includeMetadataChanges: true }, (snap) => {
      items = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      statusEl.classList.toggle("live", !snap.metadata.fromCache);
      statusText.textContent = snap.metadata.fromCache ? "Offline" : "Live";
      paint();
    }, noAccess));

    listen(onSnapshot(query(collection(db, "invites"), where("fromUid", "==", user.uid), where("listId", "==", listId)),
      (snap) => { sentInvites = snap.docs.map((d) => ({ id: d.id, ...d.data() })); paint(); }, () => {}));
  }
</script>
</body>
</html>
